name: Temporary Phase 1 formatter
on:
  push:
    branches: [bootstrap/p1-01-foundation]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    if: github.repository == 'aloneradiance-star/BTCLIANGHUA'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Apply deterministic style fixes
        run: |
          ruff check --fix .
          ruff format .
      - name: Commit only autoformatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: autoformat Phase 1 source'
            git push origin HEAD:bootstrap/p1-01-foundation
          fi
