name: Temporary P1-02 formatter
on:
  push:
    branches: [feat/p1-02-public-market-data]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Format
        run: |
          ruff check --fix .
          ruff format .
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style(p1-02): apply Ruff formatting'
            git push origin HEAD:feat/p1-02-public-market-data
          fi
