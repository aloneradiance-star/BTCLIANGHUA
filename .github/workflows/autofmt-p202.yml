name: Temporary P2-02 formatter
on:
  push:
    branches: [feat/p2-02-public-backtest-data]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Format strict Python
        run: ruff format .
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style(P2-02): apply Ruff formatting'
            git push origin HEAD:feat/p2-02-public-backtest-data
          fi
