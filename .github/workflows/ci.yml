name: Phase 1 CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baqs_test
          POSTGRES_USER: baqs
          POSTGRES_PASSWORD: baqs_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baqs -d baqs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy src
      - name: Offline tests
        run: python -m pytest -q
      - name: PostgreSQL migration and precision tests
        env:
          BAQS_DATABASE_URL: postgresql+psycopg://baqs:baqs_dev_only@localhost:5432/baqs_test
          BAQS_TEST_POSTGRES_URL: postgresql+psycopg://baqs:baqs_dev_only@localhost:5432/baqs_test
        run: |
          alembic upgrade head
          python -m pytest -q tests/test_postgres.py
          alembic downgrade base
          alembic upgrade head
      - name: No private API usage (Phase 1)
        run: python -m pytest -q tests/test_safety.py
