name: Phase 1 CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy src
      - name: Offline tests
        run: python -m pytest -q
      - name: No private API usage (Phase 1)
        run: python -m pytest -q tests/test_safety.py
