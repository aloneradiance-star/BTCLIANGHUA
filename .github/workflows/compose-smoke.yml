name: Docker Compose smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: baqs-compose-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and start with a fresh database
        run: docker compose up --build --detach

      - name: Verify migration, read-only API and startup logging
        run: |
          set -euo pipefail
          base_url=http://127.0.0.1:8000
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 \
            --max-time 5 "$base_url/openapi.json" > "$RUNNER_TEMP/baqs-openapi.json"
          jq -e '.paths | length > 0 and all(.[]; keys == ["get"])' \
            "$RUNNER_TEMP/baqs-openapi.json" > /dev/null

          revision=$(docker compose exec -T db psql -X -U baqs -d baqs -At -v ON_ERROR_STOP=1 \
            -c 'SELECT version_num FROM alembic_version')
          test -n "$revision"
          printf 'Database migration: %s\n' "$revision"

          status=$(curl --silent --show-error --max-time 10 --output "$RUNNER_TEMP/baqs-health.json" \
            --write-out '%{http_code}' "$base_url/api/v1/health")
          jq -e --arg code "$status" '
            .database == "CONNECTED" and .execution_enabled == false and
            (($code == "200" and .status == "FOUNDATION_READY") or
             ($code == "503" and .status == "DEGRADED" and .market_data == "UNAVAILABLE"))
          ' "$RUNNER_TEMP/baqs-health.json" > /dev/null
          printf 'API health HTTP %s: ' "$status"
          jq -c . "$RUNNER_TEMP/baqs-health.json"

          curl --fail --silent --show-error --max-time 10 \
            "$base_url/api/v1/market/candles?symbol=BTCUSDT&timeframe=5m" \
            | jq -e '.items == []' > /dev/null
          curl --fail --silent --show-error --max-time 10 \
            "$base_url/api/v1/market/regimes?timeframe=15m" \
            | jq -e '.timeframe == "15m" and (.symbols | length == 2 and
                all(.[]; .status == "UNAVAILABLE"))' > /dev/null
          docker compose logs --no-color --no-log-prefix api \
            | jq -Rse 'split("\n") | map(fromjson?) |
                any(.[]; .logger == "baqs.api" and .message == "application_started")' > /dev/null

      - name: Verify startup rejects real trading mode
        run: |
          set -euo pipefail
          if output=$(docker compose run --rm --no-deps -T -e BAQS_LIVE_ENABLED=true api \
              python -c 'import baqs.api' 2>&1); then
            echo 'The API unexpectedly accepted BAQS_LIVE_ENABLED=true.'
            exit 1
          fi
          if ! grep -Fq 'Phase 1 forbids live trading' <<< "$output"; then
            echo 'Startup failed for a reason other than the live trading mode guard.'
            exit 1
          fi

      - name: Verify readiness fails when PostgreSQL stops
        run: |
          set -euo pipefail
          docker compose stop db
          status=$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/baqs-health.json" \
            --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/health)
          test "$status" = 503
          jq -e '.status == "DEGRADED" and .database == "UNAVAILABLE" and
            .execution_enabled == false' "$RUNNER_TEMP/baqs-health.json" > /dev/null

      - name: Collect container diagnostics
        if: failure()
        run: docker compose logs --no-color

      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
